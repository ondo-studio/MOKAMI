<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="따뜻한 감성을 담은 양모펠트 인형 및 소품 주문제작 브랜드 모카미(MOKAMI)입니다.">

    <meta property="og:title" content="MOKAMI | 모카미 | 양모펠트 | 주문제작">
    <meta property="og:description" content="따뜻한 감성을 담은 양모펠트 인형 및 소품 주문제작 브랜드 모카미입니다.">
    <meta property="og:type" content="website">

    <title>MOKAMI | 모카미 | 양모펠트 | 주문제작</title>
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        @font-face {
    font-family: 'OngleipParkDahyeon';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2411-3@1.0/Ownglyph_ParkDaHyun.woff2') format('woff2');
    font-weight: normal;
    font-display: swap;
}

        :root {
          --bg: #fde0e9;
          --text: #695148;
          --text-light: #a8897e;
          --rose: #d4607a;
          --soft-rose: #e8a0b0;
          --blush: #f4b8c8;
          --card-bg: rgba(255,255,255,0.68);
          --card-border: rgba(212, 96, 122, 0.18);
          --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
          min-height: 100vh;
          background: var(--bg);
          font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
          overflow-x: hidden;
          position: relative;
          color: var(--text);
        }

        /* Radial gradient blobs */
        .bg-blob {
          position: fixed;
          border-radius: 50%;
          pointer-events: none;
          z-index: 0;
          animation: floatBlob 10s ease-in-out infinite;
        }
        .bg-blob-1 {
          width: 600px; height: 600px;
          background: radial-gradient(circle, rgba(205,80,110,0.22) 0%, transparent 70%);
          top: -160px; left: -160px;
          animation-delay: 0s;
        }
        .bg-blob-2 {
          width: 500px; height: 500px;
          background: radial-gradient(circle, rgba(205,80,110,0.18) 0%, transparent 70%);
          bottom: -120px; right: -120px;
          animation-delay: -4s;
        }
        .bg-blob-3 {
          width: 380px; height: 380px;
          background: radial-gradient(circle, rgba(210,90,120,0.13) 0%, transparent 70%);
          top: 38%; left: 55%;
          animation-delay: -7s;
        }

        @keyframes floatBlob {
          0%, 100% { transform: translate(0, 0) scale(1); }
          40%  { transform: translate(18px, -22px) scale(1.05); }
          70%  { transform: translate(-12px, 14px) scale(0.96); }
        }

        .container {
          position: relative;
          z-index: 1;
          max-width: 500px;
          margin: 0 auto;
          padding: 45px 22px;
        }

        /* ── Profile ── */
        .profile {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          margin-bottom: 40px;
          animation: fadeUp 0.7s ease both;
          animation-delay: 0.1s;
        }

        .avatar-wrap {
          position: relative;
          margin-bottom: 30px;
        }
        .avatar {
          width: 96px; height: 96px;
          border-radius: 50%;
          overflow: hidden;
          box-shadow:
            0 0 0 4px var(--white),
            0 0 0 7px var(--blush),
            0 14px 40px rgba(205, 80, 110, 0.22);
          position: relative;
          z-index: 1;
          background: var(--blush);
        }
        .avatar img {
          width: 100%; height: 100%;
          object-fit: cover;
          display: block;
        }
        .avatar-ring {
          position: absolute;
          inset: -14px;
          border-radius: 50%;
          border: 1.5px dashed var(--soft-rose);
          animation: spin 20s linear infinite;
          z-index: 0;
          opacity: 0.7;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .profile-badge {
          display: inline-flex;
          align-items: center;
          gap: 7px;
          background: rgba(255,255,255,0.7);
          border: 1px solid var(--blush);
          border-radius: 999px;
          padding: 5px 15px;
          font-size: 11px;
          font-weight: 500;
          color: var(--text-light);
          letter-spacing: 0.07em;
          text-transform: uppercase;
          margin-bottom: 14px;
        }
        .badge-dot {
          width: 6px; height: 6px;
          border-radius: 50%;
          background: var(--rose);
          animation: pulse 2.2s ease-in-out infinite;
        }
        @keyframes pulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50%       { transform: scale(1.5); opacity: 0.55; }
        }

        .profile-name {
          font-family: 'OngleipParkDahyeon';
          font-size: 40px;
          color: var(--text);
          letter-spacing: 0.04em;
          line-height: 1;
        }

        .profile-bio {
          font-size: 14px;
          color: var(--text-light);
          line-height: 1.8;
          max-width: 340px;
          font-weight: 500;
        }

        /* ── Marquee ── */
        .marquee-wrap {
          overflow: hidden;
          margin: 0 -22px 38px;
          position: relative;
        }
        .marquee-wrap::before,
        .marquee-wrap::after {
          content: '';
          position: absolute;
          top: 0; bottom: 0;
          width: 56px;
          z-index: 2;
          pointer-events: none;
        }
        .marquee-wrap::before { left: 0;  background: linear-gradient(to right, var(--bg), transparent); }
        .marquee-wrap::after  { right: 0; background: linear-gradient(to left,  var(--bg), transparent); }

        .marquee-track {
          display: flex;
          white-space: nowrap;
          animation: marquee 18s linear infinite;
        }
        .marquee-item {
          display: inline-flex;
          align-items: center;
          gap: 12px;
          padding: 0 20px;
          font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
          font-style: italic;
          font-size: 14px;
          color: var(--text-light);
        }
        .marquee-sep {
          font-style: normal;
          font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
          font-size: 10px;
          color: var(--soft-rose);
          opacity: 0.8;
        }
        @keyframes marquee {
          from { transform: translateX(0); }
          to   { transform: translateX(-50%); }
        }

        /* ── Section label ── */
        .section-label {
          font-size: 10px;
          font-weight: 500;
          letter-spacing: 0.13em;
          text-transform: uppercase;
          color: var(--text-light);
          margin-bottom: 12px;
          padding-left: 2px;
          opacity: 0.8;
          animation: fadeUp 0.7s ease both;
          animation-delay: 0.25s;
        }

        /* ── Link cards ── */
        .links-list {
          display: flex;
          flex-direction: column;
          gap: 11px;
          margin-bottom: 28px;
        }

        .link-card {
          display: flex;
          align-items: center;
          gap: 15px;
          background: var(--card-bg);
          backdrop-filter: blur(18px);
          -webkit-backdrop-filter: blur(18px);
          border: 1px solid var(--card-border);
          border-radius: 18px;
          padding: 15px 18px;
          text-decoration: none;
          color: var(--text);
          cursor: pointer;
          position: relative;
          overflow: hidden;
          transition:
            transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
            box-shadow 0.25s ease,
            border-color 0.25s ease;
          animation: fadeUp 0.6s ease both;
        }
        .link-card::before {
          content: '';
          position: absolute;
          inset: 0;
          background: linear-gradient(135deg, rgba(212,96,122,0.07), transparent);
          opacity: 0;
          transition: opacity 0.3s;
          border-radius: 18px;
        }
        .link-card:hover {
          transform: translateY(-3px) scale(1.013);
          box-shadow: 0 8px 28px rgba(205,80,110,0.16), 0 2px 6px rgba(205,80,110,0.07);
          border-color: rgba(212,96,122,0.35);
        }
        .link-card:hover::before { opacity: 1; }
        .link-card:active { transform: translateY(-1px) scale(1.005); }

        .link-icon {
          width: 46px; height: 46px;
          border-radius: 13px;
          display: flex; align-items: center; justify-content: center;
          font-size: 21px;
          flex-shrink: 0;
          position: relative; z-index: 1;
          transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .link-card:hover .link-icon { transform: rotate(-7deg) scale(1.1); }

        .icon-pink  { background: linear-gradient(135deg, #fce8ee, #f5bece); }
        .icon-rose  { background: linear-gradient(135deg, #fddde8, #f2afc3); }
        .icon-peach { background: linear-gradient(135deg, #fdeee6, #f6d0bb); }
        .icon-mauve { background: linear-gradient(135deg, #ede8f5, #d4c4ea); }
        .icon-mint  { background: linear-gradient(135deg, #e8f5f0, #c4e8d8); }

        .link-info { flex: 1; position: relative; z-index: 1; }
        .link-title {
          font-weight: 700;
          font-size: 15px;
          color: var(--text);
          margin-bottom: 2px;
          line-height: 1.3;
        }
        .link-desc {
          font-size: 12px;
          color: var(--text-light);
          font-weight: 500;
        }

        .link-arrow {
          width: 27px; height: 27px;
          border-radius: 50%;
          background: rgba(255,255,255,0.6);
          border: 1px solid var(--blush);
          display: flex; align-items: center; justify-content: center;
          color: var(--rose);
          font-size: 14px;
          flex-shrink: 0;
          position: relative; z-index: 1;
          transition: background 0.25s, transform 0.25s, color 0.25s;
        }
        .link-card:hover .link-arrow {
          background: var(--rose);
          color: var(--white);
          transform: translateX(3px);
          border-color: var(--rose);
        }

        /* Ripple */
        .ripple {
          position: absolute;
          border-radius: 50%;
          background: rgba(212, 96, 122, 0.18);
          transform: scale(0);
          animation: rippleOut 0.6s ease-out forwards;
          pointer-events: none;
        }
        @keyframes rippleOut { to { transform: scale(4); opacity: 0; } }

        /* ── Divider ── */
        .divider {
          display: flex;
          align-items: center;
          gap: 12px;
          margin: 4px 0 18px;
        }
        .divider-line {
          flex: 1;
          height: 1px;
          background: linear-gradient(to right, transparent, var(--blush), transparent);
        }
        .divider-dot {
          width: 5px; height: 5px;
          border-radius: 50%;
          background: var(--soft-rose);
          opacity: 0.7;
        }

        /* ── Footer ── */
        .footer {
          margin-top: 48px;
          text-align: center;
          animation: fadeUp 0.7s ease both;
          animation-delay: 0.85s;
        }
        .footer-brand {
          font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Helvetica Neue", "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
          font-size: 16px;
          color: var(--text-light);
          letter-spacing: 0.06em;
        }
        .footer-text {
          margin-top: 6px;
          font-size: 11px;
          color: var(--text-light);
          letter-spacing: 0.04em;
          opacity: 0.75;
        }

        /* ── Toast ── */
        .copy-toast {
          position: fixed;
          bottom: 32px;
          left: 50%;
          transform: translateX(-50%) translateY(20px);
          background: var(--text);
          color: var(--white);
          border-radius: 999px;
          padding: 10px 24px;
          font-size: 13px;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.3s, transform 0.3s;
          z-index: 100;
          white-space: nowrap;
        }
        .copy-toast.show {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }

        /* ── Animations ── */
        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(20px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        .link-card:nth-child(1) { animation-delay: 0.30s; }
        .link-card:nth-child(2) { animation-delay: 0.38s; }
        .link-card:nth-child(3) { animation-delay: 0.46s; }
        .link-card:nth-child(4) { animation-delay: 0.54s; }
        .link-card:nth-child(5) { animation-delay: 0.62s; }
    </style>
</head>
<body>

<div class="bg-blob bg-blob-1"></div>
<div class="bg-blob bg-blob-2"></div>
<div class="bg-blob bg-blob-3"></div>

<div class="container">

    <!-- Profile -->
    <div class="profile">
        <div class="avatar-wrap">
            <div class="avatar">
                <img src="/asset/img/profile.png" alt="MOKAMI 프로필">
            </div>
        </div>
        <h1 class="profile-name">MOKAMI</h1>
        <p class="profile-bio">세상에 하나뿐인 우리 아이의 순간</p>
    </div>

    <!-- Main links -->
    <!--    <div class="section-label">주요 링크</div>-->
    <div class="links-list" id="mainLinks"></div>

    <!-- Divider -->
    <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-dot"></div>
        <div class="divider-line"></div>
    </div>

    <!-- Sub links -->
    <!--    <div class="section-label">더 보기</div>-->
    <div class="links-list" id="subLinks"></div>

    <!-- Footer -->
    <div class="footer">
        <div class="footer-brand">MOKAMI</div>
        <p class="footer-text">세상에 하나뿐인 우리 아이의 순간 · made in seoul</p>
    </div>

</div>

<div class="copy-toast" id="copyToast">✓ 이메일이 복사되었어요!</div>

<script>
    $(function() {

      const marqueeItems = [
        "MOKAMI", "모카미", "양모펠트", "モカミ",
        "MOKAMI", "모카미", "양모펠트", "モカミ",
      ];

      const mainLinks = [
      {
          emoji: "🧺",
          iconClass: "icon-rose",
          title: "모카미마켓 키링 보러가기",
          desc: "토마토 감자 수박 / 주문제작가능!",
          url: "https://smartstore.naver.com/mokami/products/13646404794",
          copyText: null
        },
        {
          emoji: "📷",
          iconClass: "icon-rose",
          title: "인스타그램",
          desc: "@mokami_official",
          url: "https://www.instagram.com/mokami_official",
          copyText: null
        },
        {
          emoji: "🛍️",
          iconClass: "icon-pink",
          title: "네이버 스마트스토어",
          desc: "모카미 공식 스토어",
          url: "https://smartstore.naver.com/mokami",
          copyText: null
        },
        {
          emoji: "📝",
          iconClass: "icon-peach",
          title: "블로그",
          desc: "모카미 공식 블로그",
          url: "https://blog.naver.com/mokami_official",
          copyText: null
        },
        {
          emoji: "🎬",
          iconClass: "icon-mauve",
          title: "유튜브",
          desc: "모카미 유튜브 채널",
          url: "#",
          copyText: null
        },
      ];

      const subLinks = [
        {
          emoji: "💌",
          iconClass: "icon-mint",
          title: "이메일 문의",
          desc: "mokami420@naver.com",
          url: "mailto:mokami420@naver.com",
          copyText: null
        },
      ];

      /* ── Build marquee ── */
      const doubled = [...marqueeItems, ...marqueeItems];
      doubled.forEach(text => {
        $('#marqueeTrack').append(
          `<span class="marquee-item">${text}<span class="marquee-sep">✦</span></span>`
        );
      });

      /* ── Build link cards ── */
      function buildCard(link) {
        const card = $(`
          <a class="link-card" href="${link.url}"
             ${link.url === '#' ? 'onclick="return false;"' : 'target="_blank" rel="noopener"'}
             ${link.copyText ? 'data-copy="' + link.copyText + '"' : ''}>
            <div class="link-icon ${link.iconClass}">${link.emoji}</div>
            <div class="link-info">
              <div class="link-title">${link.title}</div>
              <div class="link-desc">${link.desc}</div>
            </div>
            <div class="link-arrow">›</div>
          </a>
        `);

        card.on('click', function(e) {
          if ($(this).data('copy')) {
            e.preventDefault();
            navigator.clipboard.writeText($(this).data('copy')).then(showToast);
          }
          /* ripple */
          const rect = this.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height);
          const x = e.clientX - rect.left - size / 2;
          const y = e.clientY - rect.top  - size / 2;
          const $r = $('<span class="ripple">').css({ width: size, height: size, left: x, top: y });
          $(this).append($r);
          setTimeout(() => $r.remove(), 700);
        });

        return card;
      }

      mainLinks.forEach(l => $('#mainLinks').append(buildCard(l)));
      subLinks.forEach(l  => $('#subLinks').append(buildCard(l)));

      /* ── Toast ── */
      function showToast() {
        const $t = $('#copyToast');
        $t.addClass('show');
        setTimeout(() => $t.removeClass('show'), 2200);
      }

      /* ── Hover tilt ── */
      $(document).on('mousemove', '.link-card', function(e) {
        const rect = this.getBoundingClientRect();
        const rx = ((e.clientY - rect.top  - rect.height / 2) / (rect.height / 2)) * -3.5;
        const ry = ((e.clientX - rect.left - rect.width  / 2) / (rect.width  / 2)) *  3.5;
        $(this).css('transform',
          `translateY(-3px) scale(1.013) perspective(600px) rotateX(${rx}deg) rotateY(${ry}deg)`
        );
      }).on('mouseleave', '.link-card', function() {
        $(this).css('transform', '');
      });

    });
</script>
